# Self-contained semantic-release for this *public* repository.
# GitHub does not allow a public caller to uses: a reusable workflow from a
# private repo (hutch-fail/actions) — runs fail with "workflow was not found".
# Private siblings keep the thin uses: pin to hutch-fail/actions.
# Pin ubuntu-latest (ship gate): do not call determine-runner here.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ensure release labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ensure-release-labels.sh

      - name: Write semantic-release config (no CHANGELOG file)
        run: bash scripts/write-releaserc.sh

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: npx --yes semantic-release@24
