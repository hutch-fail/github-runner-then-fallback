# Non-blocking live smoke: exercise the picker with org secrets.
# Required CI stays on pinned ubuntu-latest (ci.yml). This workflow must not
# be a required status check.
name: smoke determine-runner

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: smoke-determine-runner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  determine-runner:
    # Failures here (usejoy offline, bad token, etc.) must not block merges.
    # continue-on-error cannot sit on a job that uses: a reusable workflow —
    # pass it as an input instead.
    uses: ./.github/workflows/determine-runner.yml
    with:
      continue-on-error: true
      # Default detect is usejoy; that label is not registered yet — smoke would queue forever.
      detect-runner: ubuntu-latest
    secrets:
      ORG_BILLING_TOKEN: ${{ secrets.ORG_BILLING_TOKEN }}
      BLACKSMITH_API_TOKEN: ${{ secrets.BLACKSMITH_API_TOKEN }}

  report:
    needs: determine-runner
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log chosen runner
        run: |
          set -euo pipefail
          echo "determine-runner result=${{ needs.determine-runner.result }}"
          echo "use-runner=${{ needs.determine-runner.outputs.runner }}"
