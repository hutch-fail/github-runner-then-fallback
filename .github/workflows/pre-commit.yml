# Thin caller — implementation lives in hutch-fail/pre-commit (reusable workflow).
name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'renovate[bot]'
    uses: hutch-fail/pre-commit/.github/workflows/pre-commit.yml@dfd996508e0d1d4c06ac904e4ce883600125e0d1
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ORG_BILLING_TOKEN: ${{ secrets.ORG_BILLING_TOKEN }}
