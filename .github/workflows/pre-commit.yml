# Thin caller — implementation lives in hutch-fail/pre-commit (reusable workflow).
name: pre-commit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: hutch-fail/pre-commit/.github/workflows/pre-commit.yml@77030147a25b824e38a5854e1377a3bb28deb750
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ORG_BILLING_TOKEN: ${{ secrets.ORG_BILLING_TOKEN }}
      BLACKSMITH_API_TOKEN: ${{ secrets.BLACKSMITH_API_TOKEN }}
