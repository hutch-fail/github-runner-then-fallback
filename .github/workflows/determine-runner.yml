# Reusable determine-runner job: detect on GitHub-hosted by default; work jobs
# follow the chain (GHA → Blacksmith → usejoy).
name: Determine runner

on:
  workflow_call:
    inputs:
      primary-runner:
        description: GitHub-hosted labels while under Actions headroom
        type: string
        required: false
        default: ubuntu-latest
      fallback-runner:
        description: Blacksmith labels while under Blacksmith headroom
        type: string
        required: false
        default: blacksmith-2vcpu-ubuntu-2404
      final-runner:
        description: >-
          Final overage labels (usejoy). Pass empty string for two-way
          GitHub→Blacksmith only.
        type: string
        required: false
        default: usejoy-2vcpu-ubuntu-2404
      detect-runner:
        description: >-
          Label for this determine-runner (meter) job. Defaults to
          ubuntu-latest so detection always has a registered runner.
        type: string
        required: false
        default: ubuntu-latest
      included-minutes:
        type: string
        required: false
        default: "2000"
      blacksmith-included-minutes:
        type: string
        required: false
        default: "3000"
      usage-threshold:
        type: string
        required: false
        default: "80"
      organization:
        type: string
        required: false
        default: ""
      fallback-on-error:
        type: string
        required: false
        default: "true"
      continue-on-error:
        description: >-
          When true, the determine job is marked continue-on-error (for non-blocking
          smoke). Must live here — callers cannot set continue-on-error on a job
          that uses a reusable workflow.
        type: boolean
        required: false
        default: false
      action-ref:
        description: >-
          Git ref of hutch-fail/github-runner-then-fallback for the composite
          action checkout. Cross-repo callers must pass the same SHA/tag used in
          uses: …/determine-runner.yml@…. Same-repo callers may omit (defaults to
          github.sha).
        type: string
        required: false
        default: ""
    secrets:
      ORG_BILLING_TOKEN:
        description: Classic PAT with admin:org for GitHub billing usage
        required: true
      BLACKSMITH_API_TOKEN:
        description: Blacksmith org token for usage CLI (chain mode)
        required: false
    outputs:
      runner:
        description: JSON label list for fromJson(runs-on)
        value: ${{ jobs.determine.outputs.runner }}

jobs:
  determine:
    runs-on: ${{ inputs.detect-runner != '' && inputs.detect-runner || 'ubuntu-latest' }}
    continue-on-error: ${{ inputs.continue-on-error }}
    concurrency:
      group: runner-determination-${{ github.workflow }}-${{ github.job }}
      cancel-in-progress: false
    outputs:
      runner: ${{ steps.set-runner.outputs.use-runner }}
    steps:
      # uses: ./ resolves in the *caller* workspace, not this repo — checkout
      # the action tree explicitly (same ref as the workflow pin when cross-repo).
      - name: Checkout action tree
        uses: actions/checkout@v4
        with:
          repository: hutch-fail/github-runner-then-fallback
          ref: ${{ inputs.action-ref != '' && inputs.action-ref || github.sha }}
          path: _github-runner-then-fallback
      - id: set-runner
        uses: ./_github-runner-then-fallback
        with:
          primary-runner: ${{ inputs.primary-runner }}
          fallback-runner: ${{ inputs.fallback-runner }}
          final-runner: ${{ inputs.final-runner }}
          usage-threshold: ${{ inputs.usage-threshold }}
          included-minutes: ${{ inputs.included-minutes }}
          blacksmith-included-minutes: ${{ inputs.blacksmith-included-minutes }}
          github-token: ${{ secrets.ORG_BILLING_TOKEN }}
          blacksmith-api-token: ${{ secrets.BLACKSMITH_API_TOKEN }}
          organization: ${{ inputs.organization }}
          fallback-on-error: ${{ inputs.fallback-on-error }}
