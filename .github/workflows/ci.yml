name: ci

on:
  push:
    branches: [main]
  pull_request:

# This action repo CI is Blacksmith-only — do not dogfood prefer-GHA here.
jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Offline helper tests
        run: bash tests/test_decide_helpers.sh
      - name: Shellcheck decide.sh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/decide.sh
      - name: action.yml has required inputs/outputs
        run: |
          set -euo pipefail
          grep -q 'primary-runner:' action.yml
          grep -q 'fallback-runner:' action.yml
          grep -q 'included-minutes:' action.yml
          grep -q 'github-token:' action.yml
          grep -q 'use-runner:' action.yml
          grep -q 'using: composite' action.yml
