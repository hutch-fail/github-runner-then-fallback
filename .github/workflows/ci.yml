name: ci

on:
  push:
    branches: [main]
  pull_request:

# Bootstrap CI: pin GitHub-hosted runners. Required tests must not invoke the
# picker workflow — a broken picker / missing Jog / billing failure must not
# block shipping fixes. Live picker coverage is smoke-determine-runner.yml only.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Offline helper tests
        run: bash tests/test_decide_helpers.sh
      - name: Shellcheck decide.sh
        run: bash tests/run_shellcheck.sh
      - name: action.yml has required inputs/outputs
        run: bash tests/assert_action_yml.sh
