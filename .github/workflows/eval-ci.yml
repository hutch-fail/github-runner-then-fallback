# Thin caller — implementation lives in hutch-fail/evals (reusable workflow).
# Pin hub_ref to the same commit/tag as uses: @pin.
# Pass OP_SERVICE_ACCOUNT_TOKEN so the reusable can load App credentials from
# 1Password and clone private hutch-fail/evals.
name: eval-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: eval-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval-ci:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    uses: hutch-fail/evals/.github/workflows/eval-ci.yml@113c4ed4840ed81cc5c4e319eb21c9eeeefc6baf
    with:
      evals_path: evals
      hub_ref: 113c4ed4840ed81cc5c4e319eb21c9eeeefc6baf
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ORG_BILLING_TOKEN: ${{ secrets.ORG_BILLING_TOKEN }}
