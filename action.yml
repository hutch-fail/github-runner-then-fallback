# Prefer GitHub-hosted runners while included Actions minutes remain, then fall back.
#
# Adapted from mikehardy/runner-fallback-action (Mike Hardy; lineage: ianpurton
# pattern, jimmygchen original, O-Mutt org/enterprise). We reuse the
# determine-runner → fromJson(use-runner) workflow shape and input names; the
# predicate is Actions minutes quota vs included budget, not self-hosted online.
# Not a fork — see README "Credit and adaptation".
name: GitHub Runner Then Fallback
description: >-
  Prefer GitHub-hosted runners while included Actions minutes remain; otherwise
  emit a fallback runner label (e.g. Blacksmith). Optional chain: leave headroom
  on GitHub and Blacksmith, then emit a final runner (e.g. usejoy).
author: hutch-fail
branding:
  icon: activity
  color: blue

inputs:
  primary-runner:
    description: >-
      Comma-separated labels for the primary runner while under included minutes
      (e.g. ubuntu-latest or ubuntu-24.04).
    required: true
  fallback-runner:
    description: >-
      Comma-separated labels for the fallback runner when included minutes are
      exhausted (e.g. blacksmith-2vcpu-ubuntu-2404). In chain mode (final-runner
      set), used while under the Blacksmith headroom threshold.
    required: true
  included-minutes:
    description: >-
      Included/free Actions Linux minutes budget for the current billing period.
      Compare against org usage; not returned by the billing API. Consumers
      typically pass vars.ACTIONS_INCLUDED_MINUTES (Free org default: 2000).
    required: true
  github-token:
    description: >-
      Token that can read org enhanced billing usage (classic PAT with admin:org,
      or fine-grained token with Organization Administration read). GITHUB_TOKEN
      is not sufficient.
    required: true
  organization:
    description: >-
      Organization login whose Actions usage is checked. Defaults to the owner
      of GITHUB_REPOSITORY when unset.
    required: false
    default: ""
  fallback-on-error:
    description: >-
      If true, emit the last-resort runner when a required check fails (bad
      token, API error, etc.) instead of failing the step. Two-way mode emits
      fallback-runner; chain mode (final-runner set) emits final-runner.
    required: false
    default: "true"
  final-runner:
    description: >-
      Optional. Comma-separated labels for the final runner when both GitHub and
      Blacksmith are at or past the usage-threshold headroom (e.g. a usejoy
      label). When set, enables chain mode. When empty, behavior stays two-way
      (GitHub until included-minutes, then fallback-runner).
    required: false
    default: ""
  usage-threshold:
    description: >-
      Percent of each configured allowance to use before leaving that pool
      (chain mode only). Default 80 — leave 20% headroom. Ignored in two-way mode.
    required: false
    default: "80"
  blacksmith-included-minutes:
    description: >-
      Included/free Blacksmith billable minutes for the period (chain mode).
      Not returned by the official CLI; pricing page default is 3000 x64 2vCPU
      minutes per org per month. Required for the Blacksmith step of the chain;
      if unset with final-runner set, the Blacksmith pool is skipped.
    required: false
    default: ""
  blacksmith-api-token:
    description: >-
      Blacksmith organization token (from `blacksmith org-token create`) used
      with the official CLI to read current-month billable minutes. Chain mode
      only. If unset with final-runner set, the Blacksmith pool is skipped.
    required: false
    default: ""

outputs:
  use-runner:
    description: >-
      JSON string of runner labels for workflow runs-on via fromJson of this
      output (same shape as mikehardy/runner-fallback-action, e.g. ["ubuntu-latest"]).
    value: ${{ steps.decide.outputs.use-runner }}

runs:
  using: composite
  steps:
    - name: Decide primary vs fallback runner
      id: decide
      shell: bash
      env:
        INPUT_PRIMARY_RUNNER: ${{ inputs.primary-runner }}
        INPUT_FALLBACK_RUNNER: ${{ inputs.fallback-runner }}
        INPUT_INCLUDED_MINUTES: ${{ inputs.included-minutes }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_FALLBACK_ON_ERROR: ${{ inputs.fallback-on-error }}
        INPUT_FINAL_RUNNER: ${{ inputs.final-runner }}
        INPUT_USAGE_THRESHOLD: ${{ inputs.usage-threshold }}
        INPUT_BLACKSMITH_INCLUDED_MINUTES: ${{ inputs.blacksmith-included-minutes }}
        INPUT_BLACKSMITH_API_TOKEN: ${{ inputs.blacksmith-api-token }}
      run: bash "${{ github.action_path }}/scripts/decide.sh"
